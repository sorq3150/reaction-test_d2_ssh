<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホスト管理 | 反射神経測定</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="shell"><header class="topbar"><a class="back" href="/">←</a><div><h1>ホスト管理</h1><p>部屋・測定の管理</p></div></header><section id="createPanel" class="panel"><h2>測定部屋を作成</h2><button id="createRoomBtn" class="primary">部屋を作成</button><p id="createError" class="error"></p></section><section id="roomPanel" class="hidden"><div class="panel room-code-panel"><div><span class="eyebrow">ROOM CODE</span><div id="roomCode" class="room-code">------</div></div><div class="room-meta"><span id="roomState" class="status online">待機中</span><span id="participantCount">0 / 100 台</span></div></div><section class="panel"><div class="section-heading"><h2>測定設定</h2></div><div class="settings-grid"><label>測定回数<input id="trials" type="number" min="1" max="500" value="10"></label><label>最短待機時間（秒）<input id="minWait" type="number" min="0.5" max="30" step="0.5" value="1"></label><label>最長待機時間（秒）<input id="maxWait" type="number" min="0.5" max="30" step="0.5" value="3"></label></div><button id="saveSettingsBtn" class="secondary">設定を保存</button><p id="settingsMessage" class="message"></p></section><section class="panel"><div class="section-heading"><h2>参加者一覧</h2><span id="updatedAt" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>参加者ID</th><th>名前</th><th>接続</th><th>状態</th><th>操作</th></tr></thead><tbody id="participantsBody"><tr><td colspan="5" class="empty">参加者はいません。</td></tr></tbody></table></div></section><section class="panel"><h2>測定操作</h2><p>試行ごとに全参加端末へ共通の予定時刻を送信します。</p><div class="button-row"><button id="startBtn" class="primary">測定開始</button><button id="pauseBtn" class="secondary">一時停止</button><button id="resumeBtn" class="secondary">再開</button><button id="endBtn" class="danger">測定終了</button></div><p>進行状況：<strong id="progress">未開始</strong></p><p id="hostMessage" class="message" aria-live="polite"></p></section><section class="panel"><div class="section-heading"><h2>結果回収・集計</h2><span id="resultCount" class="muted">未回収</span></div><div class="button-row"><button id="fetchResultsBtn" class="secondary">結果を取得</button><button id="csvBtn" class="secondary" disabled>CSV出力</button><button id="xlsxBtn" class="primary" disabled>Excel出力</button></div><div class="stats-grid"><div><span class="muted">有効データ数</span><strong id="validCount">0</strong></div><div><span class="muted">平均反応時間</span><strong id="avgRt">—</strong></div><div><span class="muted">中央値</span><strong id="medianRt">—</strong></div><div><span class="muted">標準偏差</span><strong id="sdRt">—</strong></div></div><div class="table-wrap"><table><thead><tr><th>参加者</th><th>試行</th><th>反応時間(ms)</th><th>入力方式</th><th>状態</th></tr></thead><tbody id="resultsBody"><tr><td colspan="5" class="empty">まだ結果を取得していません。</td></tr></tbody></table></div><p id="exportMessage" class="message">結果はデータベースに保存されます。部屋を終了しても測定結果は保持されます。</p></section><section class="panel"><button id="closeRoomBtn" class="danger">部屋を終了</button></section></section></main><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/js/host.js"></script></body></html>
