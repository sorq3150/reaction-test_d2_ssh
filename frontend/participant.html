<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参加者 | 反射神経測定</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="shell narrow"><header class="topbar"><a class="back" href="/">←</a><div><h1>参加者</h1><p>反応時間の測定</p></div></header><section id="joinPanel" class="panel"><h2>部屋に参加</h2><label for="roomInput">6桁の部屋番号</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="例：123456"><label for="nameInput">参加者名</label><input id="nameInput" maxlength="24" placeholder="名前を入力"><button id="joinBtn" class="primary full">接続する</button><p id="joinError" class="error"></p><div id="reconnectNotice" class="notice hidden">以前の参加情報があります。</div></section><section id="participantPanel" class="panel hidden"><div class="info-row"><span>部屋番号</span><strong id="joinedRoom"></strong></div><div class="info-row"><span>参加者名</span><strong id="joinedName"></strong></div><div class="info-row"><span>接続状態</span><span id="connectionState" class="status online">接続中</span></div><div id="joinStatus" class="notice">ホストの開始を待っています。</div><div id="stimulus" class="stimulus waiting" tabindex="0" aria-label="測定画面">待機中</div><p id="trialInfo" class="message">測定開始を待っています。</p><div class="info-row"><span>今回の反応時間</span><strong id="lastResult">---</strong></div><div class="info-row"><span>記録済み試行</span><strong id="savedCount">0</strong></div><button id="leaveBtn" class="secondary full">この部屋から退出</button></section><footer>測定結果はこの端末のブラウザ内に保存します。</footer></main><script src="/socket.io/socket.io.js"></script><script src="/js/participant.js"></script></body></html>
