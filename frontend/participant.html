<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16834a">
  <title>参加者 | 反射神経測定</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="participant-page">
  <main class="shell narrow" id="participantShell">
    <header class="topbar" id="pageHeader">
      <a class="back" href="/">←</a>
      <div><h1>参加者</h1><p>反応時間の測定</p></div>
    </header>

    <section id="joinPanel" class="panel">
      <h2>部屋に参加</h2>
      <label for="roomInput">6桁の部屋番号</label>
      <input id="roomInput" inputmode="numeric" maxlength="6" placeholder="例：123456" autocomplete="off">
      <label for="nameInput">参加者名</label>
      <input id="nameInput" maxlength="24" placeholder="名前を入力" autocomplete="name">
      <button id="joinBtn" class="primary full" type="button">接続する</button>
      <p id="joinError" class="error" role="alert"></p>
      <div id="reconnectNotice" class="notice hidden">以前の参加情報があります。</div>
    </section>

    <section id="participantPanel" class="participant-panel hidden" aria-label="反応測定">
      <div id="stimulus" class="stimulus waiting" aria-label="反応測定画面"></div>

      <button id="optionsToggle" class="options-toggle" type="button"
              aria-controls="optionsPanel" aria-expanded="true" aria-label="オプションを非表示">
        ×
      </button>

      <section id="optionsPanel" class="options-panel" aria-label="参加者オプション">
        <div class="options-heading">
          <strong>参加者オプション</strong>
          <button id="optionsClose" class="secondary" type="button">閉じる</button>
        </div>
        <div class="info-row"><span>部屋番号</span><strong id="joinedRoom"></strong></div>
        <div class="info-row"><span>参加者名</span><strong id="joinedName"></strong></div>
        <div class="info-row"><span>接続状態</span><span id="connectionState" class="status online">接続中</span></div>
        <div id="joinStatus" class="notice">ホストの開始を待っています。</div>
        <p id="trialInfo" class="message">測定開始を待っています。</p>
        <div class="info-row"><span>今回の反応時間</span><strong id="lastResult">---</strong></div>
        <div class="info-row"><span>記録済み試行</span><strong id="savedCount">0</strong></div>
        <button id="leaveBtn" class="secondary full" type="button">この部屋から退出</button>
      </section>
    </section>

    <footer id="pageFooter">測定結果はこの端末のブラウザ内に保存します。</footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/participant.js"></script>
</body>
</html>
